[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kavita-ingest"
version = "1.1.0"
description = "Safely identify, plan, and ingest ebooks and comics for Kavita."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["kavita", "ebooks", "comics", "epub", "cbz"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
  "lxml==6.1.1",
  "pikepdf==10.11.0",
  "platformdirs>=4.2,<5",
  "rarfile==4.5",
  "rich>=13.8,<16",
  "typer>=0.12,<1",
]

[project.scripts]
kavita-ingest = "kavita_ingest.cli:app"

[project.optional-dependencies]
compatibility-test = [
  "comicinfoxml==0.5.1",
  "lxml==6.1.1",
  "pikepdf==10.11.0",
  "pytest==9.1.1",
  "rarfile==4.5",
]
dev = [
  "mypy>=1.11,<2",
  "pytest==9.1.1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kavita_ingest = ["migrations/*.sql", "schemas/*.xsd"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/compatibility/*" = ["E501", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kavita_ingest"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "rarfile"]
ignore_missing_imports = true
