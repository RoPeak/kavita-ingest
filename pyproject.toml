[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kavita-ingest-compatibility"
version = "0.0.0"
description = "Disposable Milestone 0 compatibility harness for kavita-ingest."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
compatibility = [
  "comicinfoxml==0.5.1",
  "lxml==6.1.1",
  "pikepdf==10.11.0",
  "pytest==9.1.1",
  "rarfile==4.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/compatibility"]
addopts = "-ra"
pythonpath = ["."]

[tool.setuptools]
packages = []
